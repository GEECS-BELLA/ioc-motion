# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# Aerotech Ensemble (motorAerotech drvEnsembleAsyn): an old-style asyn motor
# driver (motorAxisDrvSET_t "motorEnsemble" under drvAsynMotorConfigure, DTYP
# asynMotor). EnsembleAsynSetup once, then per controller an IP port,
# EnsembleAsynConfig (which talks to the controller at once: probe, then
# GETPARM per axis) and drvAsynMotorConfigure; motor records on
# EnsembleMotor.db. Protocol, what each call sends and the patch: README
# "Aerotech Ensemble".

module: motorAerotech

entity_models:
  - name: EnsembleSetup
    description: |-
      Once per IOC, before any EnsembleController: the driver's controller table
      and the init switch ioc-motion patches into the driver (upstream behaviour
      is init_writes: true).
    parameters:
      max_controllers:
        type: int
        description: |-
          Most Ensemble controllers this IOC configures
        default: 1
      init_writes:
        type: bool
        description: |-
          Upstream: probe the controller with the invalid command NONE and send
          RAMP MODE @n RATE per axis and WAIT MODE NOWAIT at configuration.
          false probes with the query PLANESTATUS(0) and sends the two mode
          commands before every move, jog or home (which is refused unless
          both are acknowledged), so a boot and the idle poll send the
          controller queries only.
        default: false

    pre_init:
      - value: |
          # EnsembleAsynSetup(max_controllers)
          EnsembleAsynSetup({{max_controllers}})
          # ioc-motion's read-only-init patch (README): 1 = upstream behaviour
          var EnsembleInitWrites {{ 1 if init_writes else 0 }}

  - name: EnsembleController
    description: |-
      One Ensemble over TCP (its ASCII command socket). The driver sets the
      terminators itself (LF both ways). It talks to the controller inside
      EnsembleAsynConfig, so the asyn trace, when asked for, is switched on
      between the IP port and that call.
    parameters:
      name:
        type: id
        description: |-
          The motor asyn port name (the axes' PORT); the TCP port is <name>_IP
      P:
        type: str
        description: |-
          PV prefix of this controller's motor records, with its trailing colon
      address:
        type: str
        description: |-
          host:port of the ASCII command socket, e.g. 192.0.2.10:8000
      card:
        type: int
        description: |-
          The driver's controller index (0 .. max_controllers-1)
        default: 0
      num_axes:
        type: int
        description: |-
          Axes to use: the driver takes the first num_axes axis numbers (0..9)
          that answer GETPARM(@n, AxisName) with an ACK, in order, as driver
          axes 0..num_axes-1. A missing drive shifts every later axis down.
      moving_poll_ms:
        type: int
        description: |-
          Poll period while an axis moves, ms
        default: 100
      idle_poll_ms:
        type: int
        description: |-
          Poll period while idle, ms; 0 = no idle poll. Keep it below the
          controller's Socket2Timeout or the controller closes the socket.
        default: 1000
      trace:
        type: bool
        description: |-
          asyn trace (errors, I/O, escaped) on the TCP port from before the
          first byte: every command and reply
        default: false
      trace_file:
        type: str
        description: |-
          With trace: the file the trace goes to; empty = the console. A script
          that parses the trace wants the file: on the console the poller's
          lines interleave with the iocsh's echo and split commands.
        default: ""

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{name}}_IP", "{{address}}", 0, 0, 0)
          {% if trace %}
          {% if trace_file %}
          asynSetTraceFile("{{name}}_IP", -1, "{{trace_file}}")
          {% endif %}
          asynSetTraceIOMask("{{name}}_IP", -1, 0x2)
          asynSetTraceMask("{{name}}_IP", -1, 0x9)
          {% endif %}
          # EnsembleAsynConfig(card, asynPort, asynAddress, numAxes, movingPollMs, idlePollMs)
          EnsembleAsynConfig({{card}}, "{{name}}_IP", 0, {{num_axes}}, {{moving_poll_ms}}, {{idle_poll_ms}})
          # drvAsynMotorConfigure(motorPort, driverName, card, numAxes)
          drvAsynMotorConfigure("{{name}}", "motorEnsemble", {{card}}, {{num_axes}})

  - name: EnsembleAxis
    description: |-
      One driver axis of an EnsembleController as a motor record ($(P)$(M)) on
      EnsembleMotor.db (RSTM Never: the record never redefines the controller's
      position; RTRY 0; DISP 1 by default refuses puts to the record),
      and its power policy (default leave, upstream: no EnsembleAxisPower line).
    parameters:
      controller:
        type: object
        description: |-
          The EnsembleController this axis belongs to
      addr:
        type: int
        description: |-
          The driver axis, 0 .. num_axes-1 (the order the controller's axes
          answered at init, which is the Ensemble axis number only when no
          lower-numbered drive is missing)
      M:
        type: str
        description: |-
          PV suffix of the motor record, e.g. m1
      DESC:
        type: str
        description: |-
          Description
        default: ""
      EGU:
        type: str
        description: |-
          Engineering units: the controller's UnitsName
        default: mm
      MRES:
        type: float
        description: |-
          Motor step size (EGU) = 1 / the axis's CountsPerUnit, as read from the
          controller. No default on purpose: the driver reports positions in
          counts (program units x CountsPerUnit), and a wrong value is silent.
      PREC:
        type: int
        description: |-
          Display precision
        default: 4
      DIR:
        type: enum
        description: |-
          User direction
        default: Pos
        values:
          Pos: Pos
          Neg: Neg
      VELO:
        type: float
        description: |-
          Velocity (EGU/s), sent with each move (LINEAR ... F)
      VBAS:
        type: float
        description: |-
          Base velocity (EGU/s); the driver does not use it
        default: 0.0
      ACCL:
        type: float
        description: |-
          Seconds to velocity; a move sends RAMP RATE VELO/ACCL
        default: 0.5
      BDST:
        type: float
        description: |-
          Backlash distance (EGU); 0 = no backlash move
        default: 0
      BVEL:
        type: float
        description: |-
          Backlash velocity (EGU/s)
        default: 0
      BACC:
        type: float
        description: |-
          Backlash seconds to velocity
        default: 0.5
      DHLM:
        type: float
        description: |-
          Dial high limit (EGU), enforced by the record only (the driver never
          sets the controller's limits)
        default: 0
      DLLM:
        type: float
        description: |-
          Dial low limit (EGU); 0 and 0 = no soft limits
        default: 0
      DISP:
        type: bool
        description: |-
          Refuse every put to the record's fields but DISP itself (CA, PVA,
          the iocsh's dbpf; not database links inside the IOC) while the
          driver's status callbacks keep its readbacks live. Default true: an
          instance that writes says so with DISP false.
        default: true
      power_policy:
        type: enum
        description: |-
          Per-axis power policy (ioc-motion's patch, README "Power policy").
          leave: upstream, the driver never enables or disables on its own.
          on_for_move: before a move, jog or home, ENABLE if the axis reads
          disabled (acknowledged and read back, else no motion command; never
          FAULTACK), then power_on_delay; after the end of motion,
          power_off_delay, then DISABLE, and DMOV stays 0 until the axis reads
          disabled. keep_on: the same ENABLE before motion; a CNEN 0 put is
          refused (nothing sent, PROBLEM set) and the driver never disables.
          Boot and the idle poll send queries only under every policy.
        default: leave
        values:
          leave: leave
          on_for_move: on_for_move
          keep_on: keep_on
      power_on_delay:
        type: float
        description: |-
          Seconds after an ENABLE the driver sent, before the motion command
          (0..1: it blocks this axis's poll). on_for_move and keep_on only.
        default: 0
      power_off_delay:
        type: float
        description: |-
          Seconds from the end of motion to DISABLE (on_for_move only), at
          least the controller's moving poll period; it is also settling time
          before DMOV. No useful default: an on_for_move axis sets it.
        default: 0

    pre_init:
      - value: |
          {% if power_policy != 'leave' %}
          # EnsembleAxisPower(card, driver axis, policy, on delay s, off delay s): ioc-motion's power-policy patch
          EnsembleAxisPower({{controller.card}}, {{addr}}, "{{power_policy}}", {{power_on_delay}}, {{power_off_delay}})
          {% endif %}

    databases:
      - file: EnsembleMotor.db
        args:
          P: "{{controller.P}}"
          M:
          DESC:
          PORT: "{{controller}}"
          ADDR: "{{addr}}"
          DIR:
          VELO:
          VBAS:
          ACCL:
          BDST:
          BVEL:
          BACC:
          MRES:
          PREC:
          EGU:
          DHLM:
          DLLM:
          DISP: "{{ 1 if DISP else 0 }}"
