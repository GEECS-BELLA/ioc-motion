# yaml-language-server: $schema=../../ibek-support/_scripts/support_install_variables.json

# epics-motor/motorAerotech R1-1-1 (no recipe in upstream ibek-support: ours),
# with ioc-motion's read-only-init patch for the Ensemble driver and its motor
# database (README "Aerotech Ensemble"). master after R1-1-1 changes CI files only.
module: motorAerotech
version: R1-1-1
organization: http://github.com/epics-motor/

dbds:
  - devAerotech.dbd
  - motorRecord.dbd
  - motorSupport.dbd

libs:
  - Aerotech
  - motor
  - asyn

# One iocsh variable, upstream behaviour by default:
#   EnsembleInitWrites (drvEnsembleAsyn.cc)  1: probe with "NONE", send RAMP MODE
#   RATE per axis and WAIT MODE NOWAIT at EnsembleAsynConfig; 0: probe with a
#   query, defer both mode commands to the axis's first motion command.
# The patch also adds aerotechApp/Db/EnsembleMotor.db (RSTM Never, DISP macro).
patch_file:
  path: aerotech-ensemble-read-only-init.patch
  when: true
