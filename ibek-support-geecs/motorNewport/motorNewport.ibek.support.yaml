# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.0.1/ibek.support.schema.json

# motorNewport R1-3 with ioc-motion's patch (motorNewport-geecs.patch): the
# SMC100 entities below replace upstream ibek-support's (which built their own
# TCP port and passed the driver's step size and the record's MRES separately),
# and the ESP300 entities are ours. README "SMC100" and "ESP300 family".

module: motorNewport

entity_models:
  # Newport SMC100CC / SMC100PP (SMC100Driver, a "model 3" asynMotor driver).
  # One controller object per serial line: a single SMC100, or the first of an
  # RS-485 chain with the rest behind it. Driver axis n is chain address n+1,
  # so the chain's addresses must run 1..num_axes. Positions are the stage's
  # preset units (TP is a float); the driver divides by its step size, which
  # is the records' MRES by construction here.
  - name: SMC100Controller
    description: |-
      One SMC100 line: the driver over a geecsSerial.Port (57600 8N1, XON/XOFF,
      CR LF: the manual's settings, which the port entity must carry). The
      driver sends nothing at creation; its poller sends TP and TS per axis.
    parameters:
      name:
        type: id
        description: |-
          The motor driver's asyn port name (the axes' PORT)
      port:
        type: object
        description: |-
          The geecsSerial.Port this line is on
      P:
        type: str
        description: |-
          PV prefix of this line's motor records, with its trailing colon
      num_axes:
        type: int
        description: |-
          Controllers on the line: chain addresses 1..num_axes (1 for a single SMC100)
        default: 1
      moving_poll_ms:
        type: int
        description: |-
          Poll period while any axis moves, ms. Each poll is TP + TS per axis,
          about 10 ms each on address 1 and 16 ms on the others (manual 6.4).
        default: 500
      idle_poll_ms:
        type: int
        description: |-
          Poll period while idle, ms; 0 = none (a keypad or front-panel move is
          then not seen until the record processes)
        default: 2000
      mres:
        type: float
        description: |-
          Step size in preset units, for the driver and every axis's MRES
          alike. The controller takes and reports float positions, so this is
          a choice of counting unit, not the stage's resolution: small enough
          to show it (an SMC100PP's FRS/FRM), large enough that travel/mres
          fits an int32.
        default: 0.000001
      setter_resend:
        type: bool
        description: |-
          Upstream: setPosition and setClosedLoop (a dial redefine: SET mode
          with FOFF Frozen, an autosave restore) resend the last command left in the
          driver's buffer: usually the poller's TS, a move if the call lands
          before the poll after a move. false sends nothing and returns an
          error. Applies to every SMC100 line in the IOC.
        default: false
      status_upstream:
        type: bool
        description: |-
          Upstream TS decoding (one-digit addresses, MOVING only, no problem
          bit). false decodes every state and error bit: HOMING and JOGGING
          are motion, NOT REFERENCED / CONFIGURATION / DISABLE and the error
          bits other than end of run set the problem bit, Homed is set.
          Applies to every SMC100 line in the IOC.
        default: false

    pre_init:
      - when: first
        value: |
          # ioc-motion's SMC100 patch (README): 1 = upstream behaviour
          var SMC100SetterResend {{ 1 if setter_resend else 0 }}
          var SMC100StatusUpstream {{ 1 if status_upstream else 0 }}
      - value: |
          # SMC100CreateController(motorPort, serialPort, numAxes, movingPollMs, idlePollMs, eguPerStep)
          SMC100CreateController("{{name}}", "{{port.name}}", {{num_axes}}, {{moving_poll_ms}}, {{idle_poll_ms}}, "{{mres}}")

  - name: SMC100Axis
    description: |-
      One controller address of an SMC100Controller as a motor record
      ($(P)$(M)) on SMC100Motor.db (RSTM Never, RTRY 0, DISP).
    parameters:
      controller:
        type: object
        description: |-
          The SMC100Controller this axis is on
      address:
        type: int
        description: |-
          The controller's address on the chain, 1..controller.num_axes
          (1 for a single SMC100)
        default: 1
      M:
        type: str
        description: |-
          PV suffix of the motor record, e.g. m1
      DESC:
        type: str
        description: |-
          Description
        default: ""
      EGU:
        type: str
        description: |-
          Engineering units: the stage's preset units
        default: mm
      PREC:
        type: int
        description: |-
          Display precision
        default: 4
      DIR:
        type: enum
        description: |-
          User direction
        default: Pos
        values:
          Pos: Pos
          Neg: Neg
      VELO:
        type: float
        description: |-
          Velocity (EGU/s), sent as VA with each move; at most the controller's
          configured VA (ZT)
      VBAS:
        type: float
        description: |-
          Base velocity (EGU/s)
        default: 0.0
      ACCL:
        type: float
        description: |-
          Seconds to velocity, sent as AC = VELO/ACCL with each move; AC at most
          the controller's configured AC (ZT)
      BDST:
        type: float
        description: |-
          The record's backlash distance (EGU); 0 = none. The controller's own
          BA/BH compensation is configuration, read with ZT
        default: 0
      BVEL:
        type: float
        description: |-
          Backlash velocity (EGU/s)
        default: 0.1
      BACC:
        type: float
        description: |-
          Backlash seconds to velocity
        default: 0.25
      DHLM:
        type: float
        description: |-
          Dial high limit (EGU), enforced by the record; within the controller's SR
        default: 0
      DLLM:
        type: float
        description: |-
          Dial low limit (EGU); 0 and 0 = no record limits (the controller's SL/SR still hold)
        default: 0
      RDBD:
        type: float
        description: |-
          Retry deadband (EGU); with RTRY 0 only DMOV's "at position" uses it
        default: 0.0001
      DISP:
        type: bool
        description: |-
          Disable puts to the record (DISP 1) at boot; readbacks stay live
        default: true

    databases:
      - file: SMC100Motor.db
        args:
          P: "{{controller.P}}"
          M:
          DESC:
          PORT: "{{controller.name}}"
          ADDR: "{{address - 1}}"
          DIR:
          VELO:
          VBAS:
          ACCL:
          BDST:
          BVEL:
          BACC:
          MRES: "{{controller.mres}}"
          PREC:
          EGU:
          DHLM:
          DLLM:
          RDBD:
          DISP: "{{ 1 if DISP else 0 }}"

  # Newport ESP300 / ESP301 / ESP302 (motorNewport drvESP300 + devESP300, a
  # "model 2" driver: ESP300Setup once, ESP300Config per controller, motor
  # records on basic_motor.db with DTYP "ESP300" and OUT "#C<card> S<axis-1> @").
  # The driver reads position as TP?/<resolution>, with <resolution> = the
  # axis's FR? (no encoder) or SU? (encoder): MRES must equal it.
  - name: ESP300Setup
    description: |-
      Once per IOC, before any ESP300Controller: the driver's card table and
      poll rate, and the two init switches ioc-motion patches into the driver
      (upstream behaviour is init_stop: true, set_limits: true).
    parameters:
      max_controllers:
        type: int
        description: |-
          Most ESP300-family controllers (cards) this IOC configures
        default: 1
      scan_rate:
        type: int
        description: |-
          Poll rate while an axis moves, Hz (1 to 60)
        default: 10
      init_stop:
        type: bool
        description: |-
          Count the controller's axes at init by sending each a Stop (ST) until
          "axis number out of range" (upstream); false probes with a query (MO?)
          instead, so init writes nothing to the controller.
        default: false
      set_limits:
        type: bool
        description: |-
          Push each motor record's DHLM/DLLM into the controller's software travel
          limits (SR/SL) at record init and on every change (upstream); false leaves
          the controller's limits untouched and the record enforces its own.
        default: false

    pre_init:
      - value: |
          # ESP300Setup(max_controllers, scan_rate)
          ESP300Setup({{max_controllers}}, {{scan_rate}})
          # ioc-motion's read-only-init patch (README): 1 = upstream behaviour
          var ESP300InitStop {{ 1 if init_stop else 0 }}
          var ESP300SetLimits {{ 1 if set_limits else 0 }}

  - name: ESP300Controller
    description: |-
      One ESP300-family controller over TCP: its Ethernet command port (ESP302)
      or a terminal server in front of its RS-232 port. The driver sets the
      terminators itself (CR out, LF in; replies are CR LF). The controller's
      Ethernet port serves one client at a time.
    parameters:
      name:
        type: id
        description: |-
          The asyn port name
      P:
        type: str
        description: |-
          PV prefix of this controller's motor records, with its trailing colon
      address:
        type: str
        description: |-
          host:port of the command port, e.g. 192.0.2.10:5001
      card:
        type: int
        description: |-
          The driver's card index (0 .. max_controllers-1); the C of each axis's OUT link
        default: 0

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{name}}", "{{address}}", 0, 0, 0)
          # ESP300Config(card, asynPort, asynAddress)
          ESP300Config({{card}}, "{{name}}", 0)

  - name: ESP300Axis
    description: |-
      One axis of an ESP300Controller as a motor record ($(P)$(M)).
    parameters:
      controller:
        type: object
        description: |-
          The ESP300Controller this axis belongs to
      axis:
        type: int
        description: |-
          The controller's axis number, 1 to 3 (the S of the OUT link is axis-1)
      M:
        type: str
        description: |-
          PV suffix of the motor record, e.g. m1
      DESC:
        type: str
        description: |-
          Description
        default: ""
      EGU:
        type: str
        description: |-
          Engineering units: the controller's SN? (2 = mm)
        default: mm
      MRES:
        type: float
        description: |-
          Motor step size (EGU): the axis's FR? (no encoder) or SU? (encoder), as
          read from the controller. No default on purpose: the driver scales TP?
          by it, and a wrong value is silent at init.
      PREC:
        type: int
        description: |-
          Display precision
        default: 3
      DIR:
        type: enum
        description: |-
          User direction
        default: Pos
        values:
          Pos: Pos
          Neg: Neg
      VELO:
        type: float
        description: |-
          Velocity (EGU/s), sent with each move; the controller's VA?
        default: 0.1
      VBAS:
        type: float
        description: |-
          Base velocity (EGU/s); the controller's VB?
        default: 0.0
      ACCL:
        type: float
        description: |-
          Seconds to velocity: VELO / the controller's AC?
        default: 0.25
      BDST:
        type: float
        description: |-
          Backlash distance (EGU); 0 = no backlash move
        default: 0
      BVEL:
        type: float
        description: |-
          Backlash velocity (EGU/s)
        default: 0.1
      BACC:
        type: float
        description: |-
          Backlash seconds to velocity
        default: 0.25
      DHLM:
        type: float
        description: |-
          Dial high limit (EGU); with set_limits false, enforced by the record only
        default: 0
      DLLM:
        type: float
        description: |-
          Dial low limit (EGU); 0 and 0 = no soft limits
        default: 0

    databases:
      - file: basic_motor.db
        args:
          P: "{{controller.P}}"
          M:
          DESC:
          DTYP: ESP300
          C: "{{controller.card}}"
          S: "{{axis - 1}}"
          DIR:
          VELO:
          VBAS:
          ACCL:
          BDST:
          BVEL:
          BACC:
          MRES:
          PREC:
          EGU:
          DHLM:
          DLLM:
          INIT: ""

  # Newport Agilis AG-UC2 / AG-UC8 / AG-UC8PC (AG_UC, a "model 3" asynMotor
  # driver: open loop, positions are the controller's step counters, TP).
  # The AG-UC8 drives four channel pairs of two axes, one pair selected at a
  # time (CC); driver axis = (channel - 1) * 2 + (axis - 1). README "Agilis".
  - name: AG_UCController
    description: |-
      One Agilis controller over a geecsSerial.Port (921600 8N1 over USB, CR LF:
      the manual's settings, which the port entity must carry). With the
      entity defaults creation sends MR (remote mode) and VE; the poller sends,
      per axis, CC (only when the pair changes, then TE), TP, TS and PH.
    parameters:
      name:
        type: id
        description: |-
          The motor driver's asyn port name (the axes' PORT)
      port:
        type: object
        description: |-
          The geecsSerial.Port this controller is on
      P:
        type: str
        description: |-
          PV prefix of this controller's motor records, with its trailing colon
      num_axes:
        type: int
        description: |-
          Driver axes: 8 for an AG-UC8 (four pairs), 2 for an AG-UC2. Axes
          without an AG_UCAxis entity are not polled.
        default: 8
      moving_poll_ms:
        type: int
        description: |-
          Poll period while any axis moves, ms. One pass is TP, TS and PH per
          axis (about 16 ms each at 921600, plus the driver's 10 ms after each),
          and CC + TE at each pair change.
        default: 200
      idle_poll_ms:
        type: int
        description: |-
          Poll period while idle, ms
        default: 1000
      init_writes:
        type: bool
        description: |-
          Upstream: RS (reset: the step amplitudes and every temporary setting
          back to their defaults, local mode) at creation, and each axis's
          step amplitudes (SU) at its creation. false sends neither. Applies to
          every AG_UC controller in the IOC.
        default: false
      channel_upstream:
        type: bool
        description: |-
          Upstream: CC before every command and poll, its result ignored, so
          while one pair moves another pair's poll reads the moving pair and a
          move for another pair goes to the moving pair's axis. false sends CC
          only on a pair change, checks TE, refuses (a move or home: MAJOR
          via the slip/stall bit until one is accepted) or skips (poll) what a
          refused CC would misdirect, keeps each
          axis's own count, never loses the selection to a missing reply (it
          is learned again with CC? or TS), and sends a STOP without a CC.
          README "Agilis AG-UC8". Applies to every AG_UC controller in the
          IOC.
        default: false
      jog_allowed:
        type: bool
        description: |-
          Upstream: the record's jog (JOGF/JOGR) sends JA at a speed code
          and its release ST. false refuses the jog, nothing sent. Applies
          to every AG_UC controller in the IOC.
        default: false

    pre_init:
      - when: first
        value: |
          # ioc-motion's AG_UC patch (README "Agilis"): 1 = upstream behaviour
          var AG_UCInitWrites {{ 1 if init_writes else 0 }}
          var AG_UCChannelUpstream {{ 1 if channel_upstream else 0 }}
          var AG_UCJogAllowed {{ 1 if jog_allowed else 0 }}
      - value: |
          # AG_UCCreateController(motorPort, serialPort, numAxes, movingPollMs, idlePollMs)
          AG_UCCreateController("{{name}}", "{{port.name}}", {{num_axes}}, {{moving_poll_ms}}, {{idle_poll_ms}})

  - name: AG_UCAxis
    description: |-
      One Agilis axis (a channel pair's axis 1 or 2) as a motor record
      ($(P)$(M)) on SMC100Motor.db (asynMotor, RSTM Never, RTRY 0, DISP), in
      steps: MRES 1, the controller's step counter. Open loop: a step's size
      depends on the direction, the step amplitude and the load (manual, SU).
    parameters:
      controller:
        type: object
        description: |-
          The AG_UCController this axis is on
      channel:
        type: int
        description: |-
          The channel pair, 1..4 (1 on an AG-UC2)
        default: 1
      axis:
        type: int
        description: |-
          The axis of the pair, 1 or 2
        default: 1
      M:
        type: str
        description: |-
          PV suffix of the motor record, e.g. m1
      DESC:
        type: str
        description: |-
          Description
        default: ""
      has_limits:
        type: bool
        description: |-
          The actuator has a limit switch (AG-LS25, AG-M050L, AG-M100L): the
          record's home becomes MV (move to limit). false refuses home.
        default: false
      forward_amplitude:
        type: int
        description: |-
          Step amplitude forward (1..50), sent at creation only with
          init_writes; 0 = the driver's 50
        default: 0
      reverse_amplitude:
        type: int
        description: |-
          Step amplitude backward (-1..-50), sent at creation only with
          init_writes; 0 = the driver's -50
        default: 0
      DIR:
        type: enum
        description: |-
          User direction
        default: Pos
        values:
          Pos: Pos
          Neg: Neg
      VELO:
        type: float
        description: |-
          Velocity (steps/s): not sent (PR runs at the controller's own rate),
          the record's time estimate only; it picks the jog speed code
        default: 100
      ACCL:
        type: float
        description: |-
          Seconds to velocity (record only)
        default: 0.1
      DHLM:
        type: float
        description: |-
          Dial high limit (steps). With channel_upstream false the count is
          the driver's, 0 when the IOC starts, so the limits are relative to
          where the axis stood then (upstream: the controller's slot counter,
          zeroed at power-up or ZP)
        default: 0
      DLLM:
        type: float
        description: |-
          Dial low limit (steps); 0 and 0 = no record limits
        default: 0
      RDBD:
        type: float
        description: |-
          Retry deadband (steps); with RTRY 0 only DMOV's "at position" uses it
        default: 0.5
      DISP:
        type: bool
        description: |-
          Disable puts to the record (DISP 1) at boot; readbacks stay live
        default: true

    pre_init:
      - value: |
          # AG_UCCreateAxis(motorPort, axis, hasLimits, forwardAmplitude, reverseAmplitude)
          AG_UCCreateAxis("{{controller.name}}", {{(channel - 1) * 2 + axis - 1}}, {{ 1 if has_limits else 0 }}, {{forward_amplitude}}, {{reverse_amplitude}})

    databases:
      - file: SMC100Motor.db
        args:
          P: "{{controller.P}}"
          M:
          DESC:
          PORT: "{{controller.name}}"
          ADDR: "{{(channel - 1) * 2 + axis - 1}}"
          DIR:
          VELO:
          VBAS: "0"
          ACCL:
          BDST: "0"
          BVEL: "1"
          BACC: "0.1"
          MRES: "1"
          PREC: "0"
          EGU: steps
          DHLM:
          DLLM:
          RDBD:
          DISP: "{{ 1 if DISP else 0 }}"
