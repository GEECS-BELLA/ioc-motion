# yaml-language-server: $schema=../../ibek-support/_scripts/support_install_variables.json

# epics-motor/motorPIGCS2 R1-3-1 (no recipe in upstream ibek-support: ours;
# INFN's ibek-support-infn recipe targets their fork), with ioc-motion's patch
# for PI's old "Hexapod" controller (README "PI hexapod (motorPIGCS2)").
module: motorPIGCS2
version: R1-3-1
organization: http://github.com/epics-motor/

dbds:
  - PI_GCS2Support.dbd
  - motorRecord.dbd
  - motorSupport.dbd

libs:
  - PI_GCS2Support
  - motor
  - asyn

# The patch (motorPIGCS2-geecs.patch): eight iocsh variables, upstream
# behaviour (1 / 0 as noted) by default:
#   PIHexapodInitServo     (PIHexapodController.cpp)  1: SVO <axis> 1 per axis at init; 0: SVO? <axis> read instead
#   PIHexapodHomeAllowed   (PIHexapodController.cpp)  1: INI from the INIT record or the record's home; 0: refused with an error
#   PIHexapodVmoCheck      (PIHexapodController.cpp)  0: none; 1: VMO <targets> before every MOV, "1" refuses the move
#   PIHexapodSendVel       (PIHexapodController.cpp)  1: VEL <axis> <v> before every move; 0: nothing
#   PIHexapodPosWithChar3  (PIHexapodController.cpp)  1: #3 probed and used while moving; 0: never sent, POS? <axis>
#   PIHexapodJogAllowed    (PIHexapodController.cpp)  1: JOGF/JOGR send MOV <axis> <limit>; 0: refused
#   PIHexapodSetPosAllowed (PIHexapodController.cpp)  1: SET sends RON/POS/RON; 0: refused
#   PIHexapodAutoInit      (PIHexapodController.cpp)  0: nothing; 1: INI at init when #4 says not referenced
# and the fixes: getStatus reporting the servo state it knows (upstream leaves
# it uninitialized), counts rounded, the axis's asynUser set, INI without an
# axis identifier, the aggregate status parameter kept (MSTA at init), #4 read
# every poll for the controller-level records, no MOV while not referenced,
# *IDN? asked once more when the first goes unanswered, an empty reply no
# longer indexing the byte before the buffer in sendAndReceive. It
# also adds pigcs2App/Db/PIHexapodMotor.db (RSTM Never, RTRY 0, DISP) and
# PIHexapodCtrl.db (DEFER, STATUS_WORD, REFERENCED, INITIALISING, STATE, INIT,
# the pivot readbacks, LAST_ERR).
patch_file:
  path: motorPIGCS2-geecs.patch
  when: true
