# yaml-language-server: $schema=../../ibek-support/_scripts/support_install_variables.json

# epics-motor/motorPIGCS2 R1-3-1 (no recipe in upstream ibek-support: ours;
# INFN's ibek-support-infn recipe targets their fork), with ioc-motion's patch
# for PI's old "Hexapod" controller (README "PI hexapod (motorPIGCS2)").
module: motorPIGCS2
version: R1-3-1
organization: http://github.com/epics-motor/

dbds:
  - PI_GCS2Support.dbd
  - motorRecord.dbd
  - motorSupport.dbd

libs:
  - PI_GCS2Support
  - motor
  - asyn

# The patch (motorPIGCS2-geecs.patch): three iocsh variables, upstream
# behaviour (1 / 0 as noted) by default:
#   PIHexapodInitServo   (PIHexapodController.cpp)  1: SVO <axis> 1 per axis at init; 0: SVO? <axis> read instead
#   PIHexapodHomeAllowed (PIHexapodController.cpp)  1: INI X on the record's home; 0: refused with an error
#   PIHexapodVmoCheck    (PIHexapodController.cpp)  0: none; 1: VMO <targets> before every MOV, "1" refuses the move
# and getStatus reporting the servo state it knows (upstream leaves it
# uninitialized). It also adds pigcs2App/Db/PIHexapodMotor.db (RSTM Never,
# RTRY 0, DISP) and PIHexapodCtrl.db (DEFER, the pivot readbacks, LAST_ERR).
patch_file:
  path: motorPIGCS2-geecs.patch
  when: true
